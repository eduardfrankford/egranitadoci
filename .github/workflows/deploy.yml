name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Ohne Repository-Variable CUSTOM_DOMAIN: Preview unter https://<user>.github.io/egranitadoci/ (noindex).
      # Mit CUSTOM_DOMAIN=egranitadoci.com: Produktions-Build mit CNAME, Sitemap und index,follow.
      - name: Build
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            npm run build
          else
            npm run build:preview
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/egranitadoci/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
